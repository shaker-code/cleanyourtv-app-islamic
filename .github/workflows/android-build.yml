name: Build Islamic APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-37" "platform-tools"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-islamic-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
